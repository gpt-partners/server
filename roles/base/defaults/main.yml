---
# Server time (UTC unless changed). The node and everything on it is down for a minute or two.
base_reboot_time: "04:00"
# Swap file as a buffer against memory peaks (fallocate size, e.g. 2G). Kubernetes pods do not
# swap (kubelet default NoSwap); k3s itself, Docker/wg-easy and the host services can.
base_swap_size: 2G
base_swap_file: /swapfile
# Swap only under real memory pressure.
base_swappiness: 10
# Packages unattended-upgrades must not install (regular expressions).
# Ubuntu kernels 7.0.0-42 and -43 have an AppArmor signal regression: processes in containers
# cannot signal each other ("kill: Permission denied"), and Prisma in LiteLLM hangs at start.
# Remove the entries once Ubuntu ships a fixed kernel.
base_unattended_upgrades_blacklist:
  - '^linux-.*-7.0.0-4[23]-'
